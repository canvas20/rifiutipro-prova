}

/* ---------- editor rifiuti trattati: macroaree › sottocategorie › riquadri descrizione + EER ---------- */
/* U[form].W = { 'Macro': { open:bool, subs:{ 'Sub': {on:bool, rows:[{d,e}]} } } , ordine in U[form].WO } */
function wInit(form, list) {
  const F = U[form] = U[form] || {}; if (F.W) return F;
  F.W = {}; F.WO = [];
  MACRO.forEach(([n, , , subs]) => { F.W[n] = { open: false, subs: {} }; F.WO.push(n); subs.forEach(s => F.W[n].subs[s] = { on: false, rows: [] }); });
  (list || []).forEach(w => { if (!F.W[w.m]) { F.W[w.m] = { open: false, subs: {} }; F.WO.push(w.m); } F.W[w.m].subs[w.s] = { on: true, rows: (w.rows || []).map(r => ({ d: r.d || '', e: r.e || '' })) }; });
  return F;
}
function wasteEditor(form, list) {
  const F = wInit(form, list);
  const tot = F.WO.reduce((a, m) => a + Object.values(F.W[m].subs).filter(s => s.on).length, 0);
  const macros = F.WO.map((m, mi) => {
    const M = F.W[m]; const info = macroInfo(m); const subs = Object.keys(M.subs); const on = subs.filter(s => M.subs[s].on).length;
    const body = M.open ? `<div class="mb">${subs.map((s, si) => {
      const S = M.subs[s]; const rows = S.rows.length ? S.rows : [{ d: '', e: '' }, { d: '', e: '' }];
      return `<div class="subc"><label class="row" style="cursor:pointer"><span class="ck ${S.on ? 'on' : ''}" data-act="wSub" data-m="${mi}" data-s="${si}">${S.on ? '✓' : ''}</span><b class="sp" data-act="wSub" data-m="${mi}" data-s="${si}">${esc(s)}</b></label>
      ${S.on ? rows.map((r, ri) => `<div class="slot"><input class="in" placeholder="Descrizione del materiale" value="${esc(r.d)}" data-w="${mi}|${si}|${ri}|d"><input class="in mono" placeholder="EER (facolt.)" value="${esc(r.e)}" data-w="${mi}|${si}|${ri}|e"><button class="x" data-act="wDelRow" data-m="${mi}" data-s="${si}" data-r="${ri}" aria-label="Elimina riga">×</button></div>`).join('') + `<button class="add" data-act="wAddRow" data-m="${mi}" data-s="${si}">+ Aggiungi riga</button>` : ''}</div>`;
    }).join('')}<button class="add" data-act="wAddSub" data-m="${mi}">+ Aggiungi sottocategoria in «${esc(m)}»</button></div>` : '';
    return `<div class="mac"><div class="mh" data-act="wOpen" data-m="${mi}"><span class="mi" style="background:${info.col}">${esc(info.ini)}</span><span class="sp"><b>${esc(m)}</b><div class="xs mut">${on} di ${subs.length} scelte</div></span><span class="mut">${M.open ? '▲' : '▼'}</span></div>${body}</div>`;
  }).join('');
  return `<div class="info"><b>${tot}</b> sottocategorie scelte. Apri una macroarea, spunta le sottocategorie e, se vuoi, scrivi descrizione e codice EER nei riquadri.</div>${macros}<button class="add" data-act="wAddMacro" data-form="${form}">+ Aggiungi macroarea</button>`;
}
function wF() { const r = route(); return r.r === 'reg' ? 'reg' : 'waste'; }
function wKeys(el) { const F = U[wF()]; const m = F.WO[+el.dataset.m]; const s = Object.keys(F.W[m].subs)[+el.dataset.s]; return { F, m, s }; }
ACT.wOpen = el => { const F = U[wF()]; const m = F.WO[+el.dataset.m]; F.W[m].open = !F.W[m].open; render(); };
ACT.wSub = el => { const { F, m, s } = wKeys(el); const S = F.W[m].subs[s]; S.on = !S.on; if (S.on && !S.rows.length) S.rows = [{ d: '', e: '' }, { d: '', e: '' }]; render(); };
ACT.wAddRow = el => { const { F, m, s } = wKeys(el); F.W[m].subs[s].rows.push({ d: '', e: '' }); render(); };
ACT.wDelRow = el => { const { F, m, s } = wKeys(el); F.W[m].subs[s].rows.splice(+el.dataset.r, 1); render(); };
ACT.wAddSub = el => { const F = U[wF()]; const m = F.WO[+el.dataset.m]; const n = (prompt('Nome della nuova sottocategoria in «' + m + '»') || '').trim(); if (!n) return; if (!F.W[m].subs[n]) F.W[m].subs[n] = { on: true, rows: [{ d: '', e: '' }, { d: '', e: '' }] }; render(); };
ACT.wAddMacro = () => { const F = U[wF()]; const n = (prompt('Nome della nuova macroarea') || '').trim(); if (!n) return; if (!F.W[n]) { F.W[n] = { open: true, subs: {} }; F.WO.push(n); } const s = (prompt('Prima sottocategoria in «' + n + '»') || '').trim(); if (s) F.W[n].subs[s] = { on: true, rows: [{ d: '', e: '' }, { d: '', e: '' }] }; render(); };
document.addEventListener('input', e => { const w = e.target.getAttribute && e.target.getAttribute('data-w'); if (!w) return; const [mi, si, ri, k] = w.split('|'); const F = U[wF()]; const m = F.WO[+mi]; const s = Object.keys(F.W[m].subs)[+si]; const S = F.W[m].subs[s]; if (!S.rows.length) S.rows = [{ d: '', e: '' }, { d: '', e: '' }]; while (S.rows.length <= +ri) S.rows.push({ d: '', e: '' }); S.rows[+ri][k] = e.target.value; });
function wasteFromForm(form) {
  const F = wInit(form); const list = [];
  for (const m of F.WO) for (const s in F.W[m].subs) { const S = F.W[m].subs[s]; if (!S.on) continue; const rows = []; for (const r of S.rows) { const d = String(r.d || '').trim(); const e0 = String(r.e || '').trim(); if (!d && !e0) continue; let e = ''; if (e0) { e = eerNorm(e0); if (!e) return { err: `Codice EER non valido in «${s}»: usa 6 cifre (es. 17 04 05).` }; } rows.push({ d, e }); } list.push({ m, s, rows }); }
  return { list };
}

ACT.reSend = () => {
  const f = k => String(fv('re', k)).trim(); const err = t => { U.re.err = t; render(); window.scrollTo(0, 0); };
  if (!f('name') || !f('surname')) return err('Inserisci nome e cognome.');
  const em = f('email').toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return err('Email non valida.');
  if (all('members').some(m => (m.email || '').toLowerCase() === em)) return err('Questa email è già registrata.');
  const pw = fv('re', 'pw'); if (pw.length < 10 || !/[a-z]/i.test(pw) || !/\d/.test(pw)) return err('Password: almeno 10 caratteri, una lettera e un numero.');
  const pin = f('pin').replace(/\D/g, ''); const co = all('companies').find(c => String(c.pin) === pin);
  if (!co) return err('PIN aziendale non valido. Chiedilo di nuovo all\'amministratore.');
  if (!fv('re', 'tos') || !fv('re', 'priv')) return err('Accetta Termini e Informativa privacy.');
  const id = uid('m_'); put('members', id, { co: co.id, name: f('name'), surname: f('surname'), email: em, role: 'operatore', status: 'pending', emailOk: true, createdAt: nowISO() });
  log('Richiesta di accesso con PIN da ' + f('name') + ' ' + f('surname'), co.id);
  setMe(id); U.re = null; go('#/home');
};

/* ---------- AGENDA ---------- */

const today = () => new Date().toISOString().slice(0, 10);
function todayBox() { const L = myEvents().filter(e => e.date === today() && !e.done); return `<div class="card"><h3>Oggi</h3>${L.length ? L.map(evRow).join('') : '<span class="mut sm">Niente in programma per oggi.</span>'}</div>`; }
function evRow(e) { const t = EVT[e.type] || EVT.appuntamento; return `<a class="li" data-go="#/evedit/${e.id}" style="${e.done ? 'opacity:.55' : ''}"><span style="width:6px;align-self:stretch;border-radius:3px;background:${t[1]}"></span><span class="sp"><b>${esc(e.title)}</b><span class="s">${t[0]}${e.time ? ' · ' + esc(e.time) : ''}${e.place ? ' · ' + esc(e.place) : ''}${e.who ? ' · ' + esc(memName(e.who)) : ''}</span></span>${e.done ? stx('n', 'Fatto') : ''}</a>`; }
XR.agenda = () => {
  const L = myEvents().sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));

    h: header('t', 'Agenda', { back: '#/home' }), t: 'home', b: `<p class="sub">${isField(m) ? 'I ritiri e gli appuntamenti assegnati a te' : 'Ritiri, consegne, scadenze e appuntamenti dell\'azienda'}</p>${!isField(m) || true ? '<button class="bt g" data-go="#/evedit/new">+ Nuovo evento</button>' : ''}
  ${Object.keys(days).length ? Object.keys(days).map(d => `<div class="sec">${d === today() ? 'Oggi · ' : ''}${fDate(d)}</div><div class="list">${days[d].map(evRow).join('')}</div>`).join('') : '<div class="empty">Niente in programma.</div>'}
  ${past.length ? `<div class="sec">Passati</div><div class="list">${past.map(evRow).join('')}</div>` : ''}

};

/* ---------- LISTINI RISERVATI ---------- */
XR.lists = (clientId) => {
  const co = myCo(); const m = me();
  if (!isG(co)) {
    const L = all('lists').filter(l => l.client === co.id && (l.rows || []).length);
    return { h: header('t', 'Listini dai collegati', { back: '#/home' }), b: `<p class="sub">Prezzi riservati che le aziende collegate hanno preparato per te.</p>${L.length ? L.map(l => listCard(l)).join('') : '<div class="empty">Nessun listino ricevuto.</div>'}` };
  }
  if (clientId) {
    const id = co.id + '__' + clientId; const cur = D.lists[id];
    if (!U.ls || U.ls._id !== id) U.ls = { _id: id, rows: clone((cur && cur.rows) || []) };
    const R = U.ls.rows;
    const others = all('lists').filter(l => l.co === co.id && l.client !== clientId && (l.rows || []).length);
    return {
      h: header('t', 'Listino per ' + coName(clientId), { back: '#/lists' }), b: `<p class="sub">Lo vede solo <b>${esc(coName(clientId))}</b>. Mai pubblico.</p>
    ${R.map((r, i) => `<div class="card"><div class="two">${`<select class="in" data-ls="${i}|m">${MACRO.map(x => `<option ${r.m === x[0] ? 'selected' : ''}>${esc(x[0])}</option>`).join('')}</select>`}<input class="in" data-ls="${i}|s" value="${esc(r.s || '')}" placeholder="Rifiuto"></div><div class="two"><input class="in mono" data-ls="${i}|e" value="${esc(r.e || '')}" placeholder="EER (facolt.)"><select class="in" data-ls="${i}|dir"><option value="offro" ${!r.dir || r.dir === 'offro' ? 'selected' : ''}>Offro</option><option value="richiedo" ${r.dir === 'richiedo' ? 'selected' : ''}>Richiedo</option><option value="gratuito" ${r.dir === 'gratuito' ? 'selected' : ''}>Gratuito</option></select></div><div class="two"><input class="in" data-ls="${i}|p" value="${esc(r.p || '')}" placeholder="Prezzo" inputmode="decimal"><select class="in" data-ls="${i}|u">${['€/kg', '€/t', '€/pezzo'].map(u => `<option ${r.u === u ? 'selected' : ''}>${u}</option>`).join('')}</select></div><div class="row"><input class="in sp" data-ls="${i}|n" value="${esc(r.n || '')}" placeholder="Note (es. trasporto incluso)"><button class="x" data-act="lsDel" data-i="${i}">×</button></div></div>`).join('')}
    <button class="add" data-act="lsAdd">+ Aggiungi riga</button>${others.length ? `<div class="row"><span class="sp sm mut">Copia listino da…</span><select class="in" style="width:auto" id="lscopy"><option value="">scegli</option>${others.map(l => `<option value="${l.id}">${esc(coName(l.client))}</option>`).join('')}</select><button class="bt gh s" data-act="lsCopy">Copia</button></div>` : ''}
    <button class="bt g" data-act="lsSave">Salva e invia al cliente</button>${cur ? `<span class="hint">Ultimo aggiornamento: ${fDT(cur.updatedAt)}</span>` : ''}` };
  }
  const P = partners(co.id);
  return { h: header('t', 'Listini riservati', { back: '#/home' }), b: `<p class="sub">Un listino per ogni cliente collegato. Lo vede solo quel cliente.</p>${P.length ? `<div class="list">${P.map(p => { const l = D.lists[co.id + '__' + p.id]; return `<a class="li" data-go="#/lists/${p.id}">${avatar(p, 1)}<span class="sp"><b>${esc(p.name)}</b><span class="s">${l && (l.rows || []).length ? l.rows.length + ' righe · aggiornato ' + fDT(l.updatedAt) : 'Nessun listino'}</span></span><span class="chev">›</span></a>`; }).join('')}</div>` : '<div class="empty">Collegati prima a un cliente.</div>'}${all('lists').some(l => l.client === co.id) ? `<div class="sec">Ricevuti dai collegati</div>${all('lists').filter(l => l.client === co.id && (l.rows || []).length).map(listCard).join('')}` : ''}` };
};
function listCard(l) { return `<div class="card"><div class="row"><b class="sp">${esc(coName(l.co))}</b><span class="xs mut">${fDT(l.updatedAt)}</span></div>${l.rows.map(r => `<div class="row sm" style="border-top:1px solid var(--line);padding-top:6px"><span class="sp"><b>${esc(r.s || r.m)}</b> <span class="mut">${esc(r.m)}${r.e ? ' · ' + esc(r.e) : ''}</span>${r.n ? `<div class="xs mut">${esc(r.n)}</div>` : ''}</span><span>${DIRL[r.dir] || 'Offro'} <b>${r.dir === 'gratuito' ? '' : money(r.p) + ' ' + esc(r.u)}</b></span></div>`).join('')}</div>`; }
document.addEventListener('input', e => { const k = e.target.getAttribute && e.target.getAttribute('data-ls'); if (!k || !U.ls) return; const [i, f] = k.split('|'); U.ls.rows[+i][f] = e.target.value; });
document.addEventListener('change', e => { const k = e.target.getAttribute && e.target.getAttribute('data-ls'); if (!k || !U.ls) return; const [i, f] = k.split('|'); U.ls.rows[+i][f] = e.target.value; });

ACT.lsCopy = () => { const v = (document.getElementById('lscopy') || {}).value; if (!v) return; U.ls.rows = clone(D.lists[v].rows); render(); };
ACT.lsSave = () => { const co = myCo(); const id = U.ls._id; const client = id.split('__')[1]; for (const r of U.ls.rows) { if (!String(r.s).trim() || (r.dir !== 'gratuito' && !String(r.p).trim())) return toast('Ogni riga richiede rifiuto e prezzo.'); if (r.e && !eerNorm(r.e)) return toast('Codice EER non valido: ' + r.e); if (r.e) r.e = eerNorm(r.e); } put('lists', id, { co: co.id, client, rows: U.ls.rows, updatedAt: nowISO() }); log('Aggiornato il listino riservato per ' + coName(client)); U.ls = null; toast('Listino inviato a ' + coName(client)); go('#/lists'); };

function toKg(q) { if (q.dir === 'gratuito') return null; const p = Number(String(q.price).replace(',', '.')); if (!isFinite(p)) return null; if (q.unit === '€/kg') return p; if (q.unit === '€/t') return p / 1000; return null; }
XR.prices = () => {
  const co = myCo(); const Q = all('quotes').filter(q => (q.from === co.id || q.to === co.id) && q.status !== 'withdrawn');
  const by = {}; Q.forEach(q => { const k = toKg(q); if (k == null) return; const key = (q.sub || q.macro) + (q.eer ? ' · ' + q.eer : ''); (by[key] = by[key] || []).push({ k, at: q.updatedAt || q.createdAt, dir: q.dir }); });
  const keys = Object.keys(by).sort();
  return { h: header('t', 'Prezzi e andamento', { back: '#/home' }), b: `<div class="info"><b>Prezzi di mercato da fonte pubblica:</b> <span class="ph">[fonte da definire]</span>. Non usiamo mai le quotazioni di altre aziende.</div><div class="sec">L'andamento nelle tue quotazioni</div>${keys.length ? keys.map(k => { const L = by[k].sort((a, b) => String(a.at).localeCompare(String(b.at))); const vs = L.map(x => x.k); const mn = Math.min(...vs), mx = Math.max(...vs), av = vs.reduce((a, b) => a + b, 0) / vs.length; const w = 300, h = 60; const pts = L.map((x, i) => `${L.length === 1 ? w / 2 : i * w / (L.length - 1)},${mx === mn ? h / 2 : h - (x.k - mn) / (mx - mn) * (h - 8) - 4}`).join(' '); return `<div class="card"><b>${esc(k)}</b><svg viewBox="0 0 ${w} ${h}" style="width:100%;height:60px"><polyline points="${pts}" fill="none" stroke="#0057F5" stroke-width="2.5"/>${L.map((x, i) => `<circle cx="${L.length === 1 ? w / 2 : i * w / (L.length - 1)}" cy="${mx === mn ? h / 2 : h - (x.k - mn) / (mx - mn) * (h - 8) - 4}" r="3.5" fill="#0057F5"/>`).join('')}</svg><div class="row sm"><span class="sp">min <b>${money(mn)}</b></span><span class="sp">medio <b>${money(av)}</b></span><span>max <b>${money(mx)}</b> €/kg</span></div><span class="hint">${L.length} quotazioni</span></div>`; }).join('') : '<div class="empty">Ancora nessuna quotazione in €/kg o €/t.</div>'}<p class="hint">Solo le quotazioni che hai inviato o ricevuto, convertite in €/kg.</p>` };
};

/* ---------- REPORT ---------- */
XR.report = () => {
  const co = myCo(); const per = fv('rp', 'p', '30'); const since = per === 'y' ? new Date(new Date().getFullYear(), 0, 1).getTime() : Date.now() - (+per) * 864e5;
  const inP = x => new Date(x.createdAt).getTime() >= since;
  const sent = all('quotes').filter(q => q.from === co.id && inP(q)), recv = all('quotes').filter(q => q.to === co.id && inP(q));
  const reqIn = all('reqs').filter(r => (r.to || []).includes(co.id) && inP(r)), reqOut = all('reqs').filter(r => r.from === co.id && inP(r));
  const byW = {}; sent.concat(recv).forEach(q => { const k = q.sub || q.macro; byW[k] = (byW[k] || 0) + 1; });
  const byC = {}; sent.forEach(q => { byC[q.to] = byC[q.to] || [0, 0]; byC[q.to][0]++; }); recv.forEach(q => { byC[q.from] = byC[q.from] || [0, 0]; byC[q.from][1]++; });
  const mxW = Math.max(1, ...Object.values(byW));
  return {
    h: header('t', 'Report e statistiche', { back: '#/home' }), b: `<div class="seg">${[['30', '30 giorni'], ['365', '12 mesi'], ['y', 'Anno']].map(([k, l]) => `<button class="${per === k ? 'on' : ''}" data-act="rpP" data-k="${k}">${l}</button>`).join('')}</div>
  <div class="kp"><div><span>Quotazioni inviate</span><b>${sent.length}</b></div><div><span>Quotazioni ricevute</span><b>${recv.length}</b></div><div><span>Confermate (ricezione)</span><b>${sent.filter(q => q.confirmedAt).length + recv.filter(q => q.confirmedAt).length}</b></div><div><span>Richieste ricevute / inviate</span><b>${reqIn.length} / ${reqOut.length}</b></div></div>
  <div class="card"><h3>Per rifiuto</h3>${Object.keys(byW).length ? Object.entries(byW).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="sm">${esc(k)}<div style="display:flex;align-items:center;gap:8px"><span style="height:10px;border-radius:5px;background:var(--blue);width:${v / mxW * 85}%"></span><b>${v}</b></div></div>`).join('') : '<span class="mut sm">Nessun dato nel periodo.</span>'}</div>
  <div class="card"><h3>Per azienda</h3>${Object.keys(byC).length ? `<dl class="dl">${Object.entries(byC).map(([c, v]) => `<dt>${esc(coName(c))}</dt><dd>${v[0]} inviate · ${v[1]} ricevute</dd>`).join('')}</dl>` : '<span class="mut sm">Nessun dato.</span>'}</div>
  <button class="bt gh" data-act="rpCsv">Esporta in Excel (CSV)</button><span class="hint">«Confermata» significa ricezione confermata. Solo i dati della tua azienda.</span>` };
};

async function download(name, text, type) { if (MODE === 'db') { try { const dl = await window.claude.use('downloads'); if (dl) { await dl.save({ filename: name, data: new Blob([text], { type }) }); return; } } catch (e) { if (e && e.code === 'cancelled') return; } } try { const b = new Blob([text], { type }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); } catch (e) { toast('Download non disponibile qui.'); } }
ACT.rpCsv = () => { const co = myCo(); const rows = [['Numero', 'Data', 'Direzione', 'Da', 'A', 'Rifiuto', 'EER', 'Prezzo', 'Unità', 'IVA', 'Stato']]; all('quotes').filter(q => q.from === co.id || q.to === co.id).forEach(q => rows.push([q.num, (q.updatedAt || q.createdAt).slice(0, 10), q.dir, coName(q.from), coName(q.to), q.sub, q.eer, String(q.price).replace('.', ','), q.unit, q.vat === 'esente' ? 'esente' : '+IVA', qStatus(q, q.to === co.id)[1]])); download('RifiutiPro_quotazioni.csv', '﻿' + rows.map(r => r.map(x => '"' + String(x ?? '').replace(/"/g, '""') + '"').join(';')).join('\n'), 'text/csv'); log('Esportate le quotazioni in CSV'); };

ACT.dlFile = el => { const f = D.files[el.dataset.id]; if (!f) return; const [h, b64] = String(f.data).split(','); const type = (h.match(/data:([^;]+)/) || [, 'application/octet-stream'])[1]; const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); download(f.name || ('documento.' + (type.split('/')[1] || 'bin')), u, type); };

/* invio: chiede al «postino» (Cloudflare Worker) di avvisare i dispositivi di un'azienda o di una persona */

    if (!b && a.status === 'sent') pushNotify(a.to, 'quotes', 'Nuova quotazione', txt, '#/quote/' + id);

  }

/* attivazione su questo dispositivo */
function tokId(t) { let h = 0; for (const ch of t) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return 'p_' + h.toString(36) + t.length; }
async function savePushDoc(token) { const m = me(); const id = tokId(token); lsSet('rp_push', JSON.stringify({ id, token, mid: m.id })); const o = { token, co: m.co, mid: m.id, kinds: memberKinds(m), ua: navigator.userAgent.slice(0, 120), at: nowISO() }; await FS.collection('push').doc(id).set(o); }
function pushLocal() { try { return JSON.parse(lsGet('rp_push') || 'null'); } catch (e) { return null; } }
ACT.pushOn = async () => {
  if (!pushReady()) return toast('Notifiche non disponibili in questa versione.');
  if (isIOS() && !isStandalone()) return modal(`<h3 style="margin:0">Prima aggiungi l'app alla schermata Home</h3><p class="mut" style="margin:0">Su iPhone le notifiche funzionano solo per l'app installata (iOS 16.4 o successivo):<br>1. in Safari tocca <b>Condividi</b> ⬆️<br>2. <b>Aggiungi alla schermata Home</b><br>3. apri RifiutiPro dall'icona e torna qui.</p><button class="bt" data-act="mClose">Ho capito</button>`);
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('Permesso negato: puoi riattivarlo dalle impostazioni del telefono.');
    toast('Attivo le notifiche…');
    const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
    if (!window.firebase.messaging) await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js');
    const token = await firebase.messaging().getToken({ vapidKey: window.FCM_VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) return toast('Il dispositivo non ha restituito un codice di notifica.');
    await savePushDoc(token); log('Notifiche attivate su un dispositivo'); toast('Notifiche attive su questo dispositivo'); render();
  } catch (e) { console.error(e); toast('Attivazione non riuscita: ' + (e && (e.code || e.message) || 'errore')); }
};
ACT.pushOff = async () => { const P = pushLocal(); if (P) { try { await FS.collection('push').doc(P.id).delete(); } catch (e) { } try { await firebase.messaging().deleteToken(); } catch (e) { } } lsSet('rp_push', null); toast('Notifiche disattivate su questo dispositivo'); render(); };
ACT.pushTest = () => { const m = me(); pushNotify(m.co, 'chat', 'Prova di notifica', 'Se leggi questo messaggio, le notifiche funzionano.', '#/privacy', m.id, true); toast('Inviata: chiudi l\'app e attendi qualche secondo'); };
/* aggiorna i tipi di avviso quando cambiano le preferenze o l'utente */
function pushRefresh() { const P = pushLocal(); const m = me(); if (!P || !m || MODE !== 'firebase' || !FS) return; if (P.mid !== m.id) { savePushDoc(P.token).catch(() => { }); return; } FS.collection('push').doc(P.id).set({ kinds: memberKinds(m), co: m.co, mid: m.id }, { merge: true }).catch(() => { }); }
const _ntf = ACT.ntf; ACT.ntf = el => { _ntf(el); setTimeout(pushRefresh, 300); };
const _logout = ACT.logout; ACT.logout = () => { const P = pushLocal(); if (P && MODE === 'firebase' && FS) { FS.collection('push').doc(P.id).delete().catch(() => { }); lsSet('rp_push', null); } _logout(); };

/* ================= PREZZI, CODICI REGALO E INVITI ================= */
const PRICE = { m: 9.99, y: 99.99 };                       // annuale: 2 mesi gratis (confermato)
const APP_URL = 'https://canvas20.github.io/rifiutipro-prova/';
const eur = v => money(v) + ' €';
function promoCfg() { const g = D.settings.promo || {}; return { perCo: g.perCo != null ? +g.perCo : 5, chain: !!g.chain, days: g.days != null ? +g.days : 365 }; }
function newCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 8; i++) s += A[Math.floor(Math.random() * A.length)]; return 'RP-' + s.slice(0, 4) + '-' + s.slice(4); }
function codeId(c) { return String(c || '').trim().toUpperCase().replace(/\s+/g, ''); }
function myGiftCodes(co) { return all('promo').filter(p => p.kind === 'referral' && p.ownerCo === co.id).sort((a, b) => String(a.code).localeCompare(String(b.code))); }
function promoMail(p, fromName) {
  const subj = 'Un anno di RifiutiPro in regalo';
  const body = `Buongiorno${p.toName ? ' ' + p.toName : ''},\n\nle regaliamo un anno di abbonamento a RifiutiPro, l'app per collegarsi con impianti, trasportatori e intermediari e scambiare quotazioni in modo riservato.\n\n1. Apra dal telefono ${APP_URL} e la aggiunga alla schermata Home (Safari > Condividi > Aggiungi alla schermata Home)\n2. Si registri come Gestore ambientale o Visualizzatore\n3. Inserisca il codice regalo durante la registrazione, oppure in Profilo > Il tuo piano:\n\n   ${p.code}\n\nIl codice vale un anno di abbonamento (valore ${eur(PRICE.y)}) ed è utilizzabile una sola volta.\n\nCordiali saluti\n${fromName || 'Soluzione Rifiuti S.r.l.'}`;
  return 'mailto:' + encodeURIComponent(p.toEmail || '') + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body);
}
function promoShareText(p, fromName) { return `Ti regalo un anno di RifiutiPro, l'app per le quotazioni nel settore rifiuti. Apri ${APP_URL} e inserisci il codice ${p.code} durante la registrazione o in Profilo > Il tuo piano. ${fromName ? '— ' + fromName : ''}`; }
/* applica un codice (regalo di Soluzione Rifiuti, o regalato da un'azienda) a un'azienda */
function redeemCode(raw, co) {
  const c = codeId(raw);
  if (!c) return { ok: false, msg: 'Scrivi il codice.' };
  if (c === 'PROVA2026') {
    if (co.plan && co.plan.promo === c) return { ok: false, msg: 'Codice già usato.' };
    const base = planOn(co) ? new Date(co.plan.until) : new Date(); base.setDate(base.getDate() + 30);
    patch('companies', co.id, { plan: { type: (co.plan && co.plan.type) || 'promo', until: base.toISOString(), promo: c } }); log('Applicato il codice promozionale ' + c + ' (+30 giorni)', co.id);
    return { ok: true, msg: 'Codice valido: 30 giorni gratis aggiunti al piano.' };
  }
  const p = get('promo', c);
  if (!p) return { ok: false, msg: 'Codice non valido. Controlla di averlo scritto bene (es. RP-AB12-CD34).' };
  if (p.usedBy) return { ok: false, msg: p.usedBy === co.id ? 'Hai già usato questo codice.' : 'Questo codice è già stato usato da un\'altra azienda.' };
  if (p.ownerCo === co.id) return { ok: false, msg: 'Questo è uno dei tuoi codici da regalare: dallo a un cliente.' };
  if (p.expires && new Date(p.expires) < new Date()) return { ok: false, msg: 'Codice scaduto.' };
  const cfg = promoCfg(); const days = +p.days || cfg.days;
  const base = planOn(co) ? new Date(co.plan.until) : new Date(); base.setDate(base.getDate() + days);
  patch('companies', co.id, { plan: { type: 'regalo', until: base.toISOString(), promo: c } });
  patch('promo', c, { usedBy: co.id, usedByMid: meId() || '', usedAt: nowISO() });
  log(`Applicato il codice regalo ${c}: ${days} giorni di abbonamento${p.ownerCo ? ' (regalo di ' + coName(p.ownerCo) + ')' : ''}`, co.id);
  if (p.ownerCo) log(`${co.name} ha usato il tuo codice regalo ${c}`, p.ownerCo);
  let extra = '';
  const gen = cfg.perCo > 0 && (p.kind === 'gift' || cfg.chain) && !myGiftCodes(co).length;
  if (gen) { for (let i = 0; i < cfg.perCo; i++) { const k = newCode(); put('promo', k, { code: k, kind: 'referral', ownerCo: co.id, from: c, days: cfg.days, createdAt: nowISO() }); } extra = ` In più hai ${cfg.perCo} codici da regalare ai tuoi clienti e contatti: li trovi in Profilo › Il tuo piano.`; log(`Ricevuti ${cfg.perCo} codici regalo da distribuire`, co.id); }
  return { ok: true, msg: `Codice valido: ${days === 365 ? 'un anno' : days + ' giorni'} di abbonamento aggiunto, fino al ${fDate(base.toISOString())}.${extra}` };
}

/* ---------- dati CRM ---------- */
function clientsOf(co) {
  const ids = new Set(partners(co.id).map(c => c.id));
  all('reqs').forEach(r => { if ((r.to || []).includes(co.id)) ids.add(r.from); if (r.from === co.id) (r.to || []).forEach(t => ids.add(t)); });
  all('quotes').forEach(q => { if (q.from === co.id) ids.add(q.to); if (q.to === co.id) ids.add(q.from); });
  all('crm_tasks').concat(all('crm_notes')).forEach(x => { if (x.co === co.id && x.client) ids.add(x.client); });
  ids.delete(co.id);
  return [...ids].map(id => get('companies', id)).filter(Boolean);
}
function clientStats(co, c) {
  const rq = all('reqs').filter(r => (r.from === c.id && (r.to || []).includes(co.id)) || (r.from === co.id && (r.to || []).includes(c.id)));
  const qs = all('quotes').filter(q => (q.from === co.id && q.to === c.id) || (q.from === c.id && q.to === co.id));
  const ch = D.chats[chatKey(co.id, c.id)]; const msgs = (ch && ch.msgs) || [];
  const notes = all('crm_notes').filter(n => n.co === co.id && n.client === c.id);
  const tasks = all('crm_tasks').filter(t => t.co === co.id && t.client === c.id);
  const dates = [].concat(rq.map(r => r.createdAt), qs.map(q => q.updatedAt || q.createdAt), msgs.map(x => x.at), notes.map(n => n.at)).filter(Boolean).sort();
  const l = linkBetween(co.id, c.id);
  const next = tasks.filter(t => !t.done).sort((a, b) => String(a.due).localeCompare(String(b.due)))[0];
  const sent = qs.filter(q => q.from === co.id && q.status !== 'withdrawn');

function crmDue() { const co = myCo(), m = me(); if (!co) return []; const end = new Date(); end.setHours(23, 59, 59); return all('crm_tasks').filter(t => t.co === co.id && !t.done && (!t.who || t.who === m.id) && new Date(t.due) <= end); }

function deals(co) {
  const L = [];
  all('reqs').filter(r => r.status !== 'cancelled' && (r.to || []).includes(co.id)).forEach(r => { const qs = all('quotes').filter(q => q.reqId === r.id && q.from === co.id && q.status !== 'withdrawn'); L.push({ id: 'r_' + r.id, kind: 'req', ref: r, client: r.from, title: r.sub || r.macro, qty: r.qty ? r.qty + ' ' + r.unit : '', at: r.createdAt, qs, resp: r.resp && r.resp[co.id] }); });
  all('quotes').filter(q => q.from === co.id && !q.reqId && q.status !== 'withdrawn').forEach(q => L.push({ id: 'q_' + q.id, kind: 'quote', ref: q, client: q.to, title: q.sub || q.macro, qty: '', at: q.createdAt, qs: [q], resp: 'quoted' }));

  return {
    wide: 1, h: header('t', 'Trattative', { back: '#/crm' }), b: `${crmHead('Trattative', 'Richieste ricevute e quotazioni inviate. Trascina una scheda per cambiarne la fase: è un\'informazione interna, il cliente non la vede.', `<div class="sr" style="width:260px">${IC.search}<input data-f="tr.q" data-live value="${esc(fv('tr', 'q'))}" placeholder="Cerca rifiuto o cliente"></div>`)}
  <div class="kanban">${STAGES.map(([k, l, col]) => { const C = L.filter(d => d.stage === k); return `<div class="kcol" data-stage="${k}"><div class="khd" style="border-top:4px solid ${col}"><b>${l}</b><span class="mut">${C.length}</span></div><div class="kbody">${C.map(d => { const c = get('companies', d.client); const nt = all('crm_tasks').filter(t => t.co === co.id && t.client === d.client && !t.done).sort((a, b) => String(a.due).localeCompare(String(b.due)))[0]; return `<div class="kcard" draggable="true" data-deal="${d.id}"><div class="row" style="gap:6px">${avatar(c, 1).replace('av ', 'av xs ')}<b class="sp" style="font-size:13.5px">${esc(c ? c.name : '')}</b></div><div style="font-weight:700">${esc(d.title)}</div><div class="xs mut">${d.qty ? esc(d.qty) + ' · ' : ''}${fDT(d.at)}</div>${d.price ? `<div class="xs" style="color:var(--navy);font-weight:700">${d.price}</div>` : ''}${nt ? `<div class="xs" style="color:#9A5A00">⏰ ${fDT(nt.due)} · ${esc(nt.title)}</div>` : ''}<div class="row" style="gap:4px;margin-top:4px"><a class="xs" href="${d.kind === 'req' ? '#/req/' + d.ref.id : '#/quote/' + d.ref.id}">Apri</a><span class="sp"></span>${d.manual ? `<a class="xs mut" href="#" data-act="stReset" data-deal="${d.id}" title="Torna alla fase automatica">auto</a>` : ''}<select class="ksel" data-act-change="stSet" data-deal="${d.id}">${STAGES.map(s => `<option value="${s[0]}" ${s[0] === d.stage ? 'selected' : ''}>${s[1]}</option>`).join('')}</select></div></div>`; }).join('') || '<div class="xs mut" style="text-align:center;padding:12px">—</div>'}</div></div>`; }).join('')}</div>
  <p class="hint">Le fasi si aggiornano da sole (richiesta ricevuta → quotata → vista → ricezione confermata). Se sposti una scheda a mano, resta lì finché non tocchi «auto». «Conclusa» e «Non andata» servono solo al tuo team: RifiutiPro non conclude contratti.</p>`,
    after: () => {
      document.querySelectorAll('.kcard').forEach(k => k.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', k.dataset.deal); k.classList.add('drag'); }));
      document.querySelectorAll('.kcol').forEach(c => { c.addEventListener('dragover', e => { e.preventDefault(); c.classList.add('over'); }); c.addEventListener('dragleave', () => c.classList.remove('over')); c.addEventListener('drop', e => { e.preventDefault(); c.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'); if (id) setStage(id, c.dataset.stage); }); });
    }
  };
};
function setStage(dealId, stage) { const co = myCo(); const d = deals(co).find(x => x.id === dealId); if (!d) return; if (stage === d.auto) del('crm_stage', co.id + '__' + dealId); else put('crm_stage', co.id + '__' + dealId, { co: co.id, deal: dealId, stage, by: meId(), at: nowISO() }); log('Trattativa «' + d.title + '» con ' + coName(d.client) + ': ' + (STAGES.find(s => s[0] === stage) || [, stage])[1]); }
document.addEventListener('change', e => { if (e.target.getAttribute && e.target.getAttribute('data-act-change') === 'stSet') setStage(e.target.dataset.deal, e.target.value); });
ACT.stReset = el => { del('crm_stage', myCo().id + '__' + el.dataset.deal); };

/* ---------- Tabelle ed esportazioni ---------- */
XR.tabelle = (tab) => {
  const n = needCrm(); if (n) return n;
  const co = myCo(); tab = tab || 'quotes'; let body = '';
  if (tab === 'quotes') {
    const L = all('quotes').filter(q => q.from === co.id || q.to === co.id);
    body = table('qt', [
      { t: 'Numero', v: q => q.num }, { t: 'Data', v: q => dshort(q.updatedAt || q.createdAt), sv: q => q.updatedAt || q.createdAt },
      { t: 'Verso', v: q => q.from === co.id ? 'Inviata' : 'Ricevuta' }, { t: 'Cliente / fornitore', v: q => coName(q.from === co.id ? q.to : q.from) },
      { t: 'Rifiuto', v: q => q.sub || q.macro }, { t: 'EER', v: q => q.eer || '' }, { t: 'Direzione', v: q => DIRL[q.dir] || '' },
      { t: 'Prezzo', v: q => q.dir === 'gratuito' ? 0 : Number(q.price), num: 1, h: q => q.dir === 'gratuito' ? 'gratuito' : money(q.price), csv: q => q.dir === 'gratuito' ? '0' : String(q.price).replace('.', ',') },
      { t: 'Unità', v: q => q.dir === 'gratuito' ? '' : q.unit }, { t: 'Stato', v: q => qStatus(q, q.to === co.id)[1], h: q => { const s = qStatus(q, q.to === co.id); return stx(s[0], s[1]); } },
    ], L, { sort: 1, dir: -1, href: q => '#/quote/' + q.id, file: 'quotazioni' });
  } else if (tab === 'reqs') {
    const L = all('reqs').filter(r => r.from === co.id || (r.to || []).includes(co.id));
    body = table('rq', [
      { t: 'Numero', v: r => r.num }, { t: 'Data', v: r => dshort(r.createdAt), sv: r => r.createdAt }, { t: 'Verso', v: r => r.from === co.id ? 'Inviata' : 'Ricevuta' },
      { t: 'Da / a', v: r => r.from === co.id ? (r.to || []).map(coName).join(', ') : coName(r.from) }, { t: 'Macroarea', v: r => r.macro }, { t: 'Rifiuto', v: r => r.sub },
      { t: 'EER', v: r => r.eer || '' }, { t: 'Quantità', v: r => r.qty ? r.qty + ' ' + r.unit : '' }, { t: 'Stato', v: r => r.status === 'cancelled' ? 'Annullata' : r.from === co.id ? 'Inviata' : reqState(r, co.id)[1] },
    ], L, { sort: 1, dir: -1, href: r => '#/req/' + r.id, file: 'richieste' });
  } else if (tab === 'clients') { location.hash = '#/clienti'; return { b: '' }; }
  else if (tab === 'tasks') {
    const L = all('crm_tasks').filter(t => t.co === co.id);
    body = table('tk', [{ t: 'Scadenza', v: t => fDT(t.due), sv: t => t.due }, { t: 'Cosa', v: t => t.title }, { t: 'Cliente', v: t => t.client ? coName(t.client) : '' }, { t: 'Per chi', v: t => t.who ? memName(t.who) : 'Team' }, { t: 'Stato', v: t => t.done ? 'Fatto' : new Date(t.due) < new Date() ? 'Scaduto' : 'Da fare' }], L, { sort: 0, dir: 1, file: 'promemoria' });
  }
  return { wide: 1, h: header('t', 'Tabelle', { back: '#/crm' }), b: `${crmHead('Tabelle ed esportazioni', 'Filtra, ordina ed esporta in Excel (CSV)')}<div class="seg" style="max-width:640px">${[['quotes', 'Quotazioni'], ['reqs', 'Richieste'], ['clients', 'Clienti'], ['tasks', 'Promemoria']].map(([k, l]) => `<a href="#/tabelle/${k}" class="${tab === k ? 'on' : ''}">${l}</a>`).join('')}</div>${body}` };
};

/* ---------- su computer, la Home del gestore è il cruscotto; promemoria nella campanella ---------- */
const _vHome = vHome;
vHome = function () { if (isWide() && crmOn()) return XR.crm(); return _vHome(); };
const _notifList = notifList;
notifList = function () { const L = _notifList(); if (crmOn()) crmDue().forEach(t => L.push({ at: t.due, ic: '⏰', t: 'Promemoria: ' + t.title + (t.client ? ' · ' + coName(t.client) : ''), go: t.client ? '#/cliente/' + t.client : '#/promemoria' })); return L.sort((a, b) => String(b.at).localeCompare(String(a.at))); };
/* dal profilo di un'azienda si apre la scheda CRM */
const _vCompany2 = vCompany;
vCompany = function (id) { const v = _vCompany2(id); if (crmOn() && v.b && get('companies', id)) v.b = `<a class="bt gh s" href="#/cliente/${id}" style="width:auto;align-self:flex-start">📇 Scheda cliente (CRM)</a>` + v.b; return v; };

/* ============ avvio ============ */
render();
initStore();
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai|claudeusercontent/.test(location.host)) { navigator.serviceWorker.register('sw.js').catch(() => { }); }
</script></body></html>
