# Pubblica il «postino» delle notifiche su Cloudflare quando cambia il suo codice.
# Serve il segreto CLOUDFLARE_API_TOKEN (GitHub › Settings › Secrets and variables › Actions).
name: Pubblica il postino delle notifiche
on:
  push:
    branches: [main]
    paths: ['notifiche/**', 'wrangler.jsonc', '.github/workflows/postino.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pubblica su Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Manca il segreto CLOUDFLARE_API_TOKEN"; exit 1; fi
          npx --yes wrangler@4 deploy --keep-vars
      - name: Controlla il postino
        run: |
          sleep 5
          curl -s "https://solitary-moon-3203.carrubba-gi.workers.dev/?verifica=1&dispositivi=1"; echo
      - name: Prova del riconoscimento foto
        run: |
          U=https://solitary-moon-3203.carrubba-gi.workers.dev/eer-foto
          for f in notifiche/prova/*.jpg; do
            echo "== $f"
            printf '{"img":"data:image/jpeg;base64,%s"}' "$(base64 -w0 "$f")" > /tmp/req.json
            curl -s -X POST "$U" -H 'Origin: https://canvas20.github.io' -H 'Content-Type: application/json' --data @/tmp/req.json; echo
          done
          echo "== proposta"
          curl -s -X POST "$U" -H 'Origin: https://canvas20.github.io' -H 'Content-Type: application/json' --data '{"mode":"proponi","oggetto":"pneumatici usati","materiale":"altro","attivita":"Officina, autoriparazione","processo":"Pezzo smontato in manutenzione o riparazione"}'; echo
